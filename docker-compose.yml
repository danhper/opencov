services:
  postgres:
    image: postgres:17
    volumes:
      - ./postgresql-data/17:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: 112233
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  opencov:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./config/local.sample.exs:/opencov/config/local.exs
